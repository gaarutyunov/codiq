// Code generated by artifact/protogen from schema/codiq.graphql. DO NOT EDIT.
//
// One file's extracted facts (SPEC.md §5): the map phase's output, written to
// the shared volume (§10) and read back by the reduce (§6). The message shapes
// are the SDL's vertex tables; the identity model is the extractor's, so a row
// is named by a file-local ordinal rather than by the uuid the store assigns.

syntax = "proto3";

package codiq.facts.v1;

option go_package = "github.com/gaarutyunov/codiq/artifact/proto/codiq/facts/v1;factsv1";

// Coord is a package coordinate: the descriptor prefix (SPEC.md §4.3) the
// batch resolves from a manifest and hands to every stanza. Its four
// components are the `file` row's pkg_* columns.
//
// coord.Coord's Root is deliberately absent. Root is extraction-time
// resolution state — it is what Coord.Namespace resolves a file path
// against — and by the time an artifact exists every namespace has already
// been resolved into a descriptor suffix. The descriptor prefix is exactly
// the four components below.
message Coord {
  string scheme = 1;
  string manager = 2;
  string name = 3;
  string version = 4;
}

// Descriptor is a symbol's SCIP-style name (SPEC.md §4.3) as an artifact
// carries it: the two halves that produce it, not the joined string the
// `occurrence.descriptor` column holds. The split is §4.3's ownership
// boundary — prefix is the batch's, suffix is the stanza's — and an artifact
// is written before anything joins them.
message Descriptor {
  Coord prefix = 1;
  string suffix = 2;
}

// VertexKind names one of the SDL's vertex tables: which table an edge
// endpoint is a row in.
enum VertexKind {
  VERTEX_KIND_UNSPECIFIED = 0;
  VERTEX_KIND_FILE = 1;
  VERTEX_KIND_SCOPE = 2;
  VERTEX_KIND_OCCURRENCE = 3;
}

// EdgeKind names an extracted, intra-file edge — SPEC.md §4.4's base edge
// tables. The derived cross-file kinds are the link pass's (§7) and never
// appear in an artifact.
enum EdgeKind {
  EDGE_KIND_UNSPECIFIED = 0;
  EDGE_KIND_DEFINES = 1;
  EDGE_KIND_CONTAINS = 2;
  EDGE_KIND_REFERENCES_LOCAL = 3;
}

// Ref is an edge endpoint: which vertex table, and which row in it.
// `contains` is one label over two physical tables, so the endpoint's table
// is carried rather than inferred from the kind.
message Ref {
  VertexKind vertex = 1;
  int32 local_id = 2;
}

// Edge is a row in one of the extracted edge tables. Both endpoints are in
// this file, always: an edge that leaves the file is the link pass's.
message Edge {
  EdgeKind kind = 1;
  Ref source = 2;
  Ref target = 3;
}

// File is a row in `file`, as the extractor produces it.
message File {
  string path = 1;
  string lang = 2;
  // The pkg_* columns, as the coordinate they are.
  Coord coord = 3;
  string corpus = 4;
}

// Scope is a row in `scope`, as the extractor produces it.
message Scope {
  // Identity inside this artifact: a facts.LocalID, not the uuid
  // the store assigns at insert. Numbered from 1; 0 means none.
  int32 local_id = 1;
  string kind = 2;
  int32 range_start = 3;
  int32 range_end = 4;
  // An intra-file reference to another row's local_id; 0 means none.
  int32 parent_scope_id = 5;
}

// Occurrence is a row in `occurrence`, as the extractor produces it.
message Occurrence {
  // Identity inside this artifact: a facts.LocalID, not the uuid
  // the store assigns at insert. Numbered from 1; 0 means none.
  int32 local_id = 1;
  Descriptor descriptor = 2;
  string role = 3;
  string symbol_kind = 4;
  string name = 5;
  int32 range_start = 6;
  int32 range_end = 7;
  // An intra-file reference to another row's local_id; 0 means none.
  int32 scope_id = 8;
}

// FileFacts is everything extraction knows about one file: the unit the map
// phase writes to the shared volume and the reduce phase loads (SPEC.md §5,
// §6). It is wholly self-contained — nothing in it refers to another file.
message FileFacts {
  File file = 1;
  repeated Scope scopes = 2;
  repeated Occurrence occurrences = 3;
  repeated Edge edges = 4;

  // Non-empty when the file could not be parsed (SPEC.md §5's poison file).
  // The Parser contract returns no error, so the failure travels with the
  // facts: the row lists are empty and the caller decides what to do.
  string parse_error = 5;
}
